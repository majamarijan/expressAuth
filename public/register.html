<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset="UTF-8" />
		<meta name='viewport' content="width=device-width, initial-scale=1.0" />
		<title>Login page</title>
		<link rel='stylesheet' href='/styles.css' />
	</head>
	<body>
	<header>
			<nav>
				<ul class='flex'>
					<li>
						<a href="/">Home</a>
					</li>
					<li>
						<a href='/about'>About</a>
					</li>
					<li>
						<a href='/users'>Users</a>
					</li>
					<li><a href="/dashboard">Dashboard</a></li>
				</ul>
			</nav>
			<button>
			<a id='login' href='/login'>Login</a></button>
		</header>
		<div class='wrapper'>
		<h1>Hello USER!</h1>
		<div class='form'>
		<h3>Register FORM</h3>
		<form id="registerForm">
			<div>
				<label for='name'>Name</label><br />
				<input id='name' name='name' placeholder="John Doe" type='text' required />
			</div>
			<div>
				<label for='email'>Email</label><br />
				<input required id='email' name='email' placeholder="johndoe@mail.com" type='email' />
			</div>
			<div>
				<label for='username'>Username</label><br />
				<input required id='username' name='username' placeholder="johndoe23" type='text' />
			</div>
			<div>
				<label for='pwd'>Password</label><br />
				<input required type='password' placeholder="123456" id='pwd' name='password' />
			</div>
			<input type='submit' value="Submit" />
		</form>
		</div>
		</div>
		<script>
			document.querySelector("#registerForm").addEventListener("submit", async (e)=> {
				e.preventDefault();
				const name = document.querySelector('#name').value;
				const email = document.querySelector('#email').value;
				const username = document.querySelector('#username').value;
				const password = document.querySelector("#pwd").value;
				
				const res = await fetch("http://localhost:4000/secure/register", {
					method: 'POST',
					headers: {"Content-Type": "application/json"},
					body: JSON.stringify({name, email, username, password})
				});
				// delivered signed token
				const data = await res.json();
				if(data) {
					if(data.token){
					//store token
						localStorage.setItem('token',data.token);
						window.location.replace('/dashboard');
					}else {
						window.location.replace(data.url);
					}
				}
			});
		</script>
	</body>
</html>
