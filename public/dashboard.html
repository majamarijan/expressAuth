<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='utf-8' />
		<meta name='viewport' content="width=device-width, initial-scale:1.0" />
		<title>Dashboard</title>
		<style>
			* {
				margin:0;
				padding:0;
				box-sizing: border-box;
				}
			h1 {
				font-size: clamp(3rem,5vw, 4.5rem);
			}
			.wrapper {
				display: flex;
				padding: 3rem 2rem;
				flex-flow:column;
				gap: 1rem;
				justify-content: start;
			}
			.flex {
				display: flex;
				flex-flow: row;
				gap: 1rem;
				align-items:center;
			}
			.flex li {
				list-style:none;
				padding: 0;
			}
				header {
				background: lightgray;
				padding-inline: 2rem;
				padding-block: 1rem;
				display: flex;
				justify-content: space-between;
			}
			#login {
				text-decoration: none;
			}
			.hidden {
				display: none;
			}
			.suspense {
				width:50px;
				height:50px;
				border-radius: 50%;
				border: 2px solid purple;
				border-top: 1px solid white;
				animation: spin 1s infinite forwards;
			}
			@keyframes spin {
				0% {transform: rotate(0deg);opacity:1}
				100% {transform: rotate(360deg);opacity:.5}
				
				}
			}
		</style>
	</head>
	<body>
	<header>
			<nav>
				<ul class='flex'>
					<li>
						<a href="/">Home</a>
						
					</li>
					<li>
						<a href='/about'>About</a>
					</li>
					<li>
						<a href='/users'>Users</a>
					</li>
					<li><a href="/dashboard">Dashboard</a></li>
				</ul>
			</nav>
			<button>
			<a id='login' href='/login'>Login</a></button>
		</header>
		<div class='wrapper'>
		<div class='suspense'></div>
			<div class='ui hidden'>
				<h1>Welcome <span id='username'></span></h1>
			<div class='data'>
				<h2 id='dataTitle'></h2>
				
			</div>
			<button class='hidden' onclick="loadData();">Load data</button>
		</div>
			</div>
		<script>
		// PROTECTED ROUTE
			const token = localStorage.getItem('token');
			if(!token) {
				document.querySelector('.ui').classList.remove('hidden');
					document.querySelector('.suspense').classList.add('hidden');
					document.querySelector('#username').innerText = ' guest!';
			};
			//send token for verification
			const data = token && getData();
			data.then(user=> {
			document.querySelector('#login').innerText = 'Logout';
				if(user && user.username) {
				setTimeout(()=> {
					document.querySelector('#username').innerText = ` ${user.username}`;
					document.querySelector('.ui').classList.remove('hidden');
					document.querySelector('.suspense').classList.add('hidden');
				},1300);
				}
			})
			
			async function getData() {
				const res = await fetch('http://localhost:4000/secure/user', {
							headers: {"Authorization": `Bearer ${localStorage.getItem('token')}`}
						});
					const data = await res.json();
					return data;
			}

	</body>
</html>
