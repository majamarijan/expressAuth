<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset="UTF-8" />
		<meta name='viewport' content="width=device-width, initial-scale=1.0" />
		<title>Login page</title>
		<link rel='stylesheet' href='/styles.css' />
	</head>
	<body>
	<header>
			<nav>
				<ul class='flex'>
					<li>
						<a href="/">Home</a>
					</li>
					<li>
						<a href='/about'>About</a>
					</li>
					<li>
						<a href='/users'>Users</a>
					</li>
					<li><a href="/dashboard">Dashboard</a></li>
				</ul>
			</nav>
			<button>
			<a id='login' href='/login'>Login</a></button>
		</header>
		<div class='wrapper'>
		<h1>Hello <span class='user'>USER</span>!</h1>
		<div class='logged hidden'>You are logged.</div>
		<div class='form'>
		<h3>Please login</h3>
		<form id="loginForm">
			<div>
				<label for='username'>Username</label><br />
				<input id='username' name='username' placeholder="John Doe" type='text' required/>
			</div>
			<div>
				<label for='pwd'>Password</label><br />
				<input type='password' placeholder="123456" id='pwd' name='password' required />
			</div>
			<input type='submit' value="Submit" />
		</form>
		</div>
		</div>
		<script type='module'> 
		import isTokenExpired from './token.js';
		const token = localStorage.getItem('token');
		if (!isTokenExpired(token)) {
			document.querySelector('.form').classList.add('hidden');
			document.querySelector('.logged').classList.remove('hidden');
			document.querySelector('.user').innerText = localStorage.getItem('username');
			document.querySelector("#login").innerText = "Login";
		}else {
			console.log("Token is expired");
			document.querySelector('.user').innerText = 'USER';
			document.querySelector('.form').classList.remove('hidden');
			document.querySelector("#loginForm").addEventListener("submit", async (e)=> {
				e.preventDefault();
				const username = document.querySelector('#username').value;
				const password = document.querySelector("#pwd").value;
				
				const res = await fetch("http://localhost:4000/secure/login", {
					method: 'POST',
					headers: {"Content-Type": "application/json"},
					body: JSON.stringify({username, password})
				});
				// delivered signed token
				const data = await res.json();
				console.log(data)
					if(data && data.accessToken){
					//store token
						localStorage.setItem('token',data.accessToken);
						window.location.replace('/dashboard');
					}else {
						window.location.replace(data.url);
					}
			});

		}
		</script>
	</body>
</html>
