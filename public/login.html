<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset="UTF-8" />
		<meta name='viewport' content="width=device-width, initial-scale=1.0" />
		<title>Login page</title>
		<style>
			* {
				margin:0;
				padding:0;
				box-sizing: border-box;
				}
			h1 {
				padding: 3rem 2rem;
				font-size: clamp(3rem,5vw, 4.5rem);
			}
			.flex {
				display: flex;
				flex-flow: row;
				gap: 1rem;
				align-items:center;
			}
			.flex li {
				list-style:none;
				padding: 0;
			}
			header {
				background: lightgray;
				padding-inline: 2rem;
				padding-block: 1rem;
				display: flex;
				justify-content: space-between;
			}
			h3 {
				padding-inline: 2rem;
			}
			.form, form {
				padding-left: 2rem;
				display:flex;
				flex-flow:column;
				gap:1rem;
				max-width: 480px;
				align-items:center;
			}
			button a {
				text-decoration: none;
			}
		</style>
	</head>
	<body>
	<header>
			<nav>
				<ul class='flex'>
					<li>
						<a href="/">Home</a>
					</li>
					<li>
						<a href='/about'>About</a>
					</li>
					<li>
						<a href='/users'>Users</a>
					</li>
					<li><a href="/dashboard">Dashboard</a></li>
				</ul>
			</nav>
			<button>
			<a id='login' href='/login'>Login</a></button>
		</header>
		<h1>Hello USER!</h1>
		<div class='form'>
		<h3>Please login</h3>
		<form id="loginForm">
			<div>
				<label for='username'>Username</label><br />
				<input id='username' name='username' placeholder="John Doe" type='text' />
			</div>
			<div>
				<label for='pwd'>Password</label><br />
				<input type='password' placeholder="123456" id='pwd' name='password' />
			</div>
			<input type='submit' value="Submit" />
		</form>
		</div>
		<script> 
			document.querySelector("#loginForm").addEventListener("submit", async (e)=> {
				e.preventDefault();
				const username = document.querySelector('#username').value;
				const password = document.querySelector("#pwd").value;
				
				const res = await fetch("http://localhost:4000/secure/login", {
					method: 'POST',
					headers: {"Content-Type": "application/json"},
					body: JSON.stringify({username, password})
				});
				// delivered signed token
				const data = await res.json();
				if(data) {
					if(data.token){
					//store token
						localStorage.setItem('token',data.token);
						window.location.replace('/dashboard');
					}else {
						window.location.replace(data.url);
					}
				}
			});
		</script>
		<script type='module' src="./script.js"></script>
	</body>
</html>
