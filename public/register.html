<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset="UTF-8" />
		<meta name='viewport' content="width=device-width, initial-scale=1.0" />
		<title>Login page</title>
		<style>
			* {
				margin:0;
				padding:0;
				box-sizing: border-box;
				}
			h1 {
				padding: 3rem 2rem;
				font-size: clamp(3rem,5vw, 4.5rem);
			}
			.flex {
				display: flex;
				flex-flow: row;
				gap: 1rem;
				align-items:center;
			}
			.flex li {
				list-style:none;
				padding: 0;
			}
			header {
				background: lightgray;
				padding-inline: 2rem;
				padding-block: 1rem;
				display: flex;
				justify-content: space-between;
			}
			h3 {
				padding-inline: 2rem;
			}
			.form, form {
				padding-left: 2rem;
				display:flex;
				flex-flow:column;
				gap:1rem;
				max-width: 480px;
				align-items:center;
			}
			button a {
				text-decoration: none;
			}
		</style>
	</head>
	<body>
	<header>
			<nav>
				<ul class='flex'>
					<li>
						<a href="/">Home</a>
					</li>
					<li>
						<a href='/about'>About</a>
					</li>
					<li>
						<a href='/users'>Users</a>
					</li>
					<li><a href="/dashboard">Dashboard</a></li>
				</ul>
			</nav>
			<button>
			<a id='login' href='/login'>Login</a></button>
		</header>
		<h1>Hello USER!</h1>
		<div class='form'>
		<h3>Register FORM</h3>
		<form id="registerForm">
			<div>
				<label for='name'>Name</label><br />
				<input id='name' name='name' placeholder="John Doe" type='text' required />
			</div>
			<div>
				<label for='email'>Email</label><br />
				<input required id='email' name='email' placeholder="johndoe@mail.com" type='email' />
			</div>
			<div>
				<label for='username'>Username</label><br />
				<input required id='username' name='username' placeholder="johndoe23" type='text' />
			</div>
			<div>
				<label for='pwd'>Password</label><br />
				<input required type='password' placeholder="123456" id='pwd' name='password' />
			</div>
			<input type='submit' value="Submit" />
		</form>
		</div>
	</body>
</html>
