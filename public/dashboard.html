<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul class="flex">
          <li>
            <a href="/">Home</a>
          </li>
          <li>
            <a href="/about">About</a>
          </li>
          <li>
            <a href="/users">Users</a>
          </li>
          <li><a href="/dashboard">Dashboard</a></li>
        </ul>
      </nav>
      <button>
        <a id="login" href="/login">Login</a>
      </button>
    </header>
    <div class="wrapper">
      <div class="suspense"></div>
      <div class="ui hidden">
        <h1>Welcome <span id="username"></span></h1>
        <div class="data">
          <h2 id="dataTitle"></h2>
        </div>
        <button class="userData hidden">Load data</button>
        <div class="hidden" id="userData"></div>
      </div>
    </div>
    <script type='module'>
			import isTokenExpired from './token.js';
      // PROTECTED ROUTE
      if (isTokenExpired()) {
       document.querySelector(".ui").classList.remove("hidden");
          document.querySelector(".suspense").classList.add("hidden");
          document.querySelector("#username").innerText = " guest!";
          document.querySelector("#login").innerText = "Login";
          localStorage.removeItem("username");
      } else {
        //send token for verification
        const data = getData();
        if (data) {
          data.then((user) => {
            const loginBtn = document.querySelector("#login");
            loginBtn.innerText = "Logout";
            loginBtn.onclick= ()=> {
              const res = fetch("http://localhost:4000/secure/logout", {
                method: "GET",
                headers: {
                  Authorization: `Bearer ${localStorage.getItem("token")}`,
                },
                credentials: "include",
              });
              localStorage.removeItem("token");
              localStorage.removeItem("username");
              window.location.replace("/");
            }

            if (user && user.username) {
							localStorage.setItem('username',user.username);
              setTimeout(() => {
                document.querySelector("#username").innerText =
                  ` ${user.username}`;
                document.querySelector(".ui").classList.remove("hidden");
                document.querySelector(".suspense").classList.add("hidden");
                const dataLoader = document.querySelector(".userData");
                dataLoader.classList.remove("hidden");
                dataLoader.onclick = async()=> {
                  const res = await fetch("http://localhost:4000/secure/data", {
                    method: "GET",
                    headers: {
                      Authorization: `Bearer ${localStorage.getItem("token")}`,
                    },
                    credentials: "include",
                  });
                  return res.json().then((data) => {
                    document.querySelector("#dataTitle").innerHTML = `${data.message} 
                      <ul>
                        <li>lessonsCompleted:${data.stats.lessonsCompleted}</li>  
                        <li>badgesEarned: ${data.stats.badgesEarned}</li>
                      </ul>
                    ` ;
                  })
                }
              }, 1300);
            }
          });
        }
      }

      async function getData() {
        const res = await fetch("http://localhost:4000/secure/user", {
          method: "GET",
          headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
          credentials: "include",
        });
        const data = await res.json();
        return data;
      }

    </script>
  </body>
